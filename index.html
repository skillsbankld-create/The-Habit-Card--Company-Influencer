<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Habit Card — Activity 2</title>
<style>
  :root {
    --navy: #080828;
    --blue: #4D88E8;
    --red: #F26A44;
    --orange: #FFBC3A;
    --cyan: #40BDA9;
    --lightblue: #EBF4FF;
    --white: #FFFFFF;
    --ink: #101228;
    --muted: #5B6478;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: Calibri, "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--lightblue);
    color: var(--ink);
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  html[dir="rtl"] body { text-align: right; }

  header {
    background: var(--navy);
    padding: 14px env(safe-area-inset-right, 0px) 14px calc(18px + env(safe-area-inset-left, 0px));
    padding-right: calc(18px + env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
  }
  header .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header img {
    height: 30px;
    width: auto;
    display: block;
  }
  header .activity-name {
    color: var(--white);
    font-size: 13px;
    opacity: 0.75;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: none;
  }
  @media (min-width: 560px) {
    header .activity-name { display: inline; }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .lang-toggle {
    display: flex;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.65);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .lang-btn.active {
    background: var(--blue);
    color: var(--white);
  }

  .timer-pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--white);
    border-radius: 999px;
    padding: 6px 16px;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .timer-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
  }
  .timer-pill.stopped .dot { background: var(--cyan); }

  main {
    flex: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---- landing / group select ---- */
  .landing-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
    margin: 4px 0 6px;
  }
  .landing-steps {
    margin: 0 0 22px;
    padding-left: 22px;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.6;
  }
  .landing-steps li { margin-bottom: 6px; }
  html[dir="rtl"] .landing-steps {
    padding-left: 0;
    padding-right: 22px;
  }
  .landing-sub {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .group-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  @media (max-width: 480px) {
    .group-grid { grid-template-columns: 1fr; }
  }
  .group-btn {
    background: var(--white);
    border: 2px solid #D7E3F7;
    border-radius: 14px;
    padding: 26px 16px;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .group-btn:hover {
    border-color: var(--blue);
    box-shadow: 0 6px 18px rgba(77,136,232,0.18);
    transform: translateY(-2px);
  }
  .group-btn .num {
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .group-btn .label {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
  }

  /* ---- group / work screen ---- */
  .badge {
    display: inline-block;
    background: var(--blue);
    color: var(--white);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .screen-hint {
    color: var(--muted);
    font-size: 14.5px;
    margin: 0 0 18px;
    line-height: 1.5;
  }
  .situation-card {
    background: var(--white);
    border-left: 6px solid var(--navy);
    border-radius: 10px;
    padding: 20px 22px;
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
    margin-bottom: 26px;
    box-shadow: 0 2px 10px rgba(8,8,40,0.06);
  }
  html[dir="rtl"] .situation-card {
    border-left: none;
    border-right: 6px solid var(--navy);
  }
  .prompt-line {
    font-weight: 700;
    color: var(--navy);
    font-size: 17px;
    margin: 0 0 14px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }
  .option-card {
    background: var(--white);
    border: 2px solid #E1E8F5;
    border-left: 8px solid #E1E8F5;
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease;
  }
  html[dir="rtl"] .option-card {
    border-left-width: 2px;
    border-right-width: 8px;
  }
  .option-card:hover { border-color: #BBD0F5; }
  .option-card.selected {
    border-color: var(--blue);
    border-left-color: var(--blue);
    background: var(--lightblue);
  }
  .option-card .opt-title {
    font-weight: 700;
    font-size: 15.5px;
    color: var(--navy);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .option-card .opt-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--navy);
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    flex: none;
  }
  .option-card.selected .opt-letter { background: var(--blue); }
  .option-card .opt-text {
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.45;
    margin-left: 30px;
  }
  html[dir="rtl"] .option-card .opt-text {
    margin-left: 0;
    margin-right: 30px;
  }
  .review-choice .opt-text {
    margin-left: 0 !important;
    margin-right: 0 !important;
  }

  label.field-label {
    display: block;
    font-weight: 700;
    color: var(--navy);
    font-size: 15px;
    margin-bottom: 8px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    border: 2px solid #E1E8F5;
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    resize: vertical;
    margin-bottom: 22px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--blue);
  }

  .btn-row {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    border-radius: 999px;
    padding: 12px 26px;
    border: none;
    cursor: pointer;
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--red);
    color: var(--white);
  }
  .btn-primary:disabled {
    background: #F4B9A4;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: transparent;
    color: var(--navy);
    border: 2px solid #D7E3F7;
  }
  .hint {
    font-size: 13px;
    color: var(--muted);
    margin: -10px 0 20px;
  }

  /* ---- review screen ---- */
  .review-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 22px 0 8px;
  }
  .review-label:first-of-type { margin-top: 0; }
  .review-block {
    background: var(--white);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 16px;
    line-height: 1.5;
    box-shadow: 0 2px 10px rgba(8,8,40,0.06);
  }
  .review-choice {
    border-left: 6px solid var(--blue);
  }
  html[dir="rtl"] .review-choice {
    border-left: none;
    border-right: 6px solid var(--blue);
  }
  .review-choice .opt-title {
    font-weight: 700;
    color: var(--navy);
    font-size: 17px;
    margin-bottom: 4px;
  }
  .review-time {
    display: inline-block;
    margin-top: 26px;
    font-size: 14px;
    color: var(--muted);
  }
  .edit-link {
    background: none;
    border: none;
    color: var(--blue);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    margin-top: 24px;
  }
</style>
</head>

      justificationPlaceholder: "Why this habit, and not the other three?",

      finishBtn: "Finish & review",
      reviewHint: "This is what to read aloud when your group shares.",
      reviewLabelSituation: "The situation",
      reviewLabelChoice: "Chosen habit",
      reviewLabelJustification: "Justification",
      timeUsedLabel: "Time used",

    },
    ar: {
      documentTitle: "كارت العادات — النشاط 2",
      headerActivityName: "كارت العادات · النشاط 2",
      landingTitle: "كارت العادات",
      landingSteps: [
        "كل مجموعة هتاخد موقف واقعي من بيئة العمل مع أحد الزملاء.",

        "في النهاية، هيظهر لكم ملخص واضح تقدروا تستخدموه لما ييجي دور مجموعتكم في المشاركة."
      ],
      landingSub: "اختاروا رقم مجموعتكم للبدء.",
      groupLabel: function (n) { return "المجموعة " + n; },
      start: "ابدأ",
      workHint: "اقروا الموقف مع بعض، واتفقوا على العادة الأنسب، واكتبوا سبب اختياركم. تقدروا تغيّروا الاختيار أو تعدّلوا السبب قبل ما تنهوا النشاط.",
      promptLine: "اختاروا عادة واحدة، واستعدوا تشرحوا ليه اخترتوها.",
      justificationLabel: "سبب اختياركم",
      justificationPlaceholder: "ليه اخترتوا العادة دي تحديدًا، مش واحدة من العادات التلاتة التانية؟",
      justificationHint: "تقدروا تغيّروا اختياركم أو تعدّلوا إجابتكم في أي وقت قبل إنهاء النشاط.",
      finishBtn: "إنهاء ومراجعة",
      reviewHint: "ده الملخص اللي تقدروا تقروه لما ييجي دور مجموعتكم في المشاركة.",
      reviewLabelSituation: "الموقف",
      reviewLabelChoice: "العادة اللي اخترتوها",
      reviewLabelJustification: "سبب الاختيار",
      timeUsedLabel: "الوقت المستغرق",
      editBtn: "عدّلوا إجابتكم \u2192"
    }
  };

  // Habit titles are identical across all four groups, keyed by letter (logic key, never translated as key)
  const HABIT_TITLES_AR = {
    A: "خليك أكتر شخص يعتمدوا عليه",
    B: "انشر طاقة إيجابية بدل السلبية والتشاؤم",
    C: "قدّم حلول، مش مجرد مشاكل",
    D: "خُد المسؤولية بدل ما تستنى الإذن"
  };

  // ---------------------------------------------------------------
  // Profile data — English fields unchanged from source; Arabic fields added
  // ---------------------------------------------------------------
  const PROFILES = [
    {
      group: "Group 1",
      name: "Amir",
      situation: "Amir is the person you need input from before your project can move forward. Every time you message him, he says he will look at it soon. Two weeks pass. He is not avoiding you. His calendar is full of back-to-back meetings, and three other teams are asking him for the same kind of help this month.",
      situationAr: "أمير هو الشخص اللي محتاجين رأيه قبل ما مشروعكم يقدر يتحرك للخطوة اللي بعدها. كل مرة تبعتوا له، يقول إنه هيبص على الموضوع قريب. يعدّي أسبوعين من غير رد. هو مش بيتجنبكم، لكن جدول اجتماعاته مليان طول اليوم، وفيه تلات فرق تانية طالبة منه نفس نوع المساعدة خلال الشهر ده.",
      options: [
        { letter: "A", title: "Be the most reliable person in the room", text: "Give Amir one small, specific ask and follow through on your side immediately, so helping you never turns into more than what he agreed to.", textAr: "اطلبوا من أمير طلب صغير ومحدد، ونفّذوا الجزء المطلوب منكم فورًا، بحيث مساعدته ليكم ما تتحولش لشغل أكتر من اللي وافق عليه." },
        { letter: "B", title: "Bring energy instead of cynicism", text: "Skip the frustration when you follow up. Offer a smaller version of the ask that feels doable inside a packed week, not another thing piling on.", textAr: "لما تتابعوا معاه، ابعدوا عن نبرة الإحباط. اقترحوا نسخة أصغر من الطلب تكون واقعية وسط أسبوعه المزدحم، بدل ما تحسّسوه إنها مهمة جديدة بتتزود عليه." },
        { letter: "C", title: "Bring solutions, not just problems", text: "Narrow the ask yourself before you send it. Tell him exactly which two slides need his eyes, instead of asking him to figure out what you need.", textAr: "حدّدوا المطلوب بشكل أوضح قبل ما تبعتوا له. قولوا له بالضبط أنهي سلايدين محتاجين رأيه فيهم، بدل ما تطلبوا منه هو يحدد إنتوا محتاجين إيه." },
        { letter: "D", title: "Take ownership instead of waiting for permission", text: "Move forward on everything you can decide without him, and only bring him the one decision that truly needs his input.", textAr: "كمّلوا في كل حاجة تقدروا تقرروها من غير أمير، وارجعوا له بس في القرار الوحيد اللي فعلًا محتاج رأيه." }
      ]
    },
    {
      group: "Group 2",
      name: "Dina",
      situation: "Dina agreed weeks ago to review your proposal before it goes to the director. She still has not sent feedback. When you follow up, she says she has been busy. Looking at her actual priority list, everything on it ties back to her own targets this quarter. Your proposal is not one of them.",
      situationAr: "دينا وافقت من أسابيع إنها تراجع المقترح بتاعكم قبل ما يروح للمدير، لكنها لسه ما بعتتش أي ملاحظات. كل مرة تتابعوا معاها تقول إنها كانت مشغولة. لما تبصوا على أولوياتها الفعلية، تلاقوا إن كل حاجة فيها مرتبطة مباشرة بأهدافها للربع الحالي، ومقترحكم مش من ضمنها.",
      options: [
        { letter: "A", title: "Be the most reliable person in the room", text: "Deliver your own part of the work early and well, so Dina sees your requests as worth prioritizing, not just another ask.", textAr: "سلّموا الجزء المطلوب منكم بدري وبجودة عالية، بحيث دينا تشوف إن طلباتكم تستحق الأولوية، مش مجرد طلب إضافي." },
        { letter: "B", title: "Bring energy instead of cynicism", text: "Reintroduce the ask without mentioning she is behind. Frame it as quick and worth doing, not a task she has failed to get to.", textAr: "اطلبوا منها المراجعة تاني من غير ما تركزوا على إنها اتأخرت. قدّموا الطلب باعتباره حاجة سريعة ومفيدة، مش مهمة هي قصّرت في تنفيذها." },
        { letter: "C", title: "Bring solutions, not just problems", text: "Point out the specific part of your proposal that would help her own numbers this quarter, not just yours.", textAr: "وضحوا الجزء المحدد في المقترح اللي ممكن يساعدها تحقق أرقامها وأهدافها للربع الحالي، مش بس أهدافكم إنتوا." },
        { letter: "D", title: "Take ownership instead of waiting for permission", text: "Highlight the connection to her goals yourself, instead of waiting for her to notice it on her own.", textAr: "وضحوا بنفسكم العلاقة بين المقترح وأهدافها، بدل ما تستنوا إنها تكتشف العلاقة دي لوحدها." }
      ]
    },
    {
      group: "Group 3",
      name: "Noor",
      situation: "You ask Noor to approve a small change to a process her team owns. She keeps asking follow-up questions and wants more testing before she will agree to anything. Last year, a similar change went wrong, and the blame landed on whoever signed off on it.",
      situationAr: "طلبتوا من نور توافق على تعديل بسيط في عملية فريقها مسؤول عنها. لكنها كل مرة بتسأل أسئلة إضافية، وعايزة اختبارات أكتر قبل ما توافق على أي حاجة. السنة اللي فاتت، تغيير مشابه حصل فيه مشكلة، وفي النهاية الشخص اللي وافق عليه هو اللي اتحمّل المسؤولية.",
      options: [
        { letter: "A", title: "Be the most reliable person in the room", text: "Offer to personally track how the change performs and report back to her, so she is not left wondering what happens after she signs off.", textAr: "اعرضوا عليها إنكم هتتابعوا نتائج التغيير بنفسكم وهترجعوا لها بتحديثات واضحة، بحيث ما تفضلش قلقة من اللي هيحصل بعد ما توافق." },
        { letter: "B", title: "Bring energy instead of cynicism", text: "Present the change as a fix for a known problem, not a repeat of what went wrong last time.", textAr: "قدّموا التغيير باعتباره حل لمشكلة معروفة، مش تكرار للتجربة اللي فشلت المرة اللي فاتت." },
        { letter: "C", title: "Bring solutions, not just problems", text: "Propose a small test first, with a clear way to undo it, instead of asking her to approve the full change at once.", textAr: "اقترحوا تجربة صغيرة الأول، مع طريقة واضحة للرجوع للوضع السابق لو ما نجحتش، بدل ما تطلبوا منها توافق على التغيير بالكامل من أول مرة." },
        { letter: "D", title: "Take ownership instead of waiting for permission", text: "Tell her directly that you will take responsibility for the outcome, so the risk is not hers alone.", textAr: "وضحوا لها بشكل مباشر إنكم هتتحملوا مسؤولية النتيجة، بحيث المخاطرة ما تبقاش عليها لوحدها." }
      ]
    },
    {
      group: "Group 4",
      name: "Khaled",
      situation: "Khaled wants to help you pull data together for your report. He tells you honestly that he would like to, but his manager has him focused entirely on closing out a different project this month, and anything outside that will not count toward his goals.",
      situationAr: "خالد عايز يساعدكم تجمعوا البيانات المطلوبة للتقرير، وبيقول لكم بصراحة إنه مستعد يساعد. لكن مديره طالبه يركز بالكامل على إنهاء مشروع تاني خلال الشهر ده، وأي شغل خارج المشروع ده مش هيتحسب ضمن أهدافه.",
      options: [
        { letter: "A", title: "Be the most reliable person in the room", text: "Ask for one small, time-boxed favor and finish it quickly, so it never competes with what his manager has him focused on.", textAr: "اطلبوا منه مساعدة صغيرة ومحددة بوقت واضح، وأنهوا الجزء المطلوب بسرعة، بحيث الطلب ما ينافسش الشغل اللي مديره طالبه يركز عليه." },
        { letter: "B", title: "Bring energy instead of cynicism", text: "Acknowledge his real priority first, then show how this small piece adds to his work instead of pulling him away from it.", textAr: "اعترفوا بأولويته الحالية الأول، وبعدها وضحوا إزاي الجزء الصغير اللي محتاجينه ممكن يضيف لشغله بدل ما يبعده عنه." },
        { letter: "C", title: "Bring solutions, not just problems", text: "Connect the task to something his manager already cares about, so it reads as aligned rather than extra.", textAr: "اربطوا المهمة بحاجة مديره مهتم بيها بالفعل، بحيث تظهر كجزء متوافق مع أولوياته، مش شغل إضافي." },
        { letter: "D", title: "Take ownership instead of waiting for permission", text: "Go to his manager yourself and get buy-in directly, instead of putting Khaled in the middle.", textAr: "اتكلموا مع مدير خالد بنفسكم وخدوا موافقته مباشرة، بدل ما تحطوا خالد في النص." }
      ]
    }
  ];

  // ---------------------------------------------------------------
  // State (unchanged structure — currentLang kept separate)
  // ---------------------------------------------------------------
  let state = {
    profileIndex: null,
    selectedLetter: null,
    justification: "",
    elapsedSeconds: 0,
    timerId: null,
    timerRunning: false
  };
  let currentLang = "en";

  const screens = {
    select: document.getElementById("screen-select"),
    work: document.getElementById("screen-work"),
    review: document.getElementById("screen-review")
  };

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  // ---- build group grid (created once; text filled/updated by renderGroupGrid) ----
  const groupGrid = document.getElementById("groupGrid");
  const groupButtonRefs = [];
  PROFILES.forEach((p, idx) => {
    const btn = document.createElement("button");
    btn.className = "group-btn";
    const numDiv = document.createElement("div");
    numDiv.className = "num";
    const labelDiv = document.createElement("div");
    labelDiv.className = "label";
    btn.appendChild(numDiv);
    btn.appendChild(labelDiv);
    btn.addEventListener("click", () => startGroup(idx));
    groupGrid.appendChild(btn);
    groupButtonRefs.push({ num: numDiv, label: labelDiv });
  });

  function renderGroupGrid() {
    const t = TEXT[currentLang];
    groupButtonRefs.forEach((refs, idx) => {
      refs.num.textContent = t.groupLabel(idx + 1);
      refs.label.textContent = t.start;
    });
  }

  const justificationInput = document.getElementById("justificationInput");

  function renderStaticText() {
    const t = TEXT[currentLang];
    document.title = t.documentTitle;
    document.getElementById("headerActivityName").textContent = t.headerActivityName;
    document.getElementById("landingTitleEl").textContent = t.landingTitle;

    const stepsList = document.getElementById("landingSteps");
    stepsList.innerHTML = "";
    t.landingSteps.forEach(s => {
      const li = document.createElement("li");
      li.textContent = s;
      stepsList.appendChild(li);
    });

    document.getElementById("landingSubEl").textContent = t.landingSub;
    document.getElementById("workHintEl").textContent = t.workHint;
    document.getElementById("promptLineEl").textContent = t.promptLine;
    document.getElementById("justificationLabelEl").textContent = t.justificationLabel;
    justificationInput.placeholder = t.justificationPlaceholder;
    document.getElementById("justificationHintEl").textContent = t.justificationHint;
    document.getElementById("finishBtn").textContent = t.finishBtn;
    document.getElementById("reviewHintEl").textContent = t.reviewHint;
    document.getElementById("reviewLabelSituationEl").textContent = t.reviewLabelSituation;
    document.getElementById("reviewLabelChoiceEl").textContent = t.reviewLabelChoice;
    document.getElementById("reviewLabelJustificationEl").textContent = t.reviewLabelJustification;
    document.getElementById("editBtn").textContent = t.editBtn;

    renderGroupGrid();
  }

  // ---- render the work screen for the current state + language ----
  function renderProfileScreen() {
    if (state.profileIndex === null) return;
    const profile = PROFILES[state.profileIndex];
    const t = TEXT[currentLang];

    document.getElementById("workBadge").textContent = t.groupLabel(state.profileIndex + 1);
    document.getElementById("situationText").textContent = currentLang === "ar" ? profile.situationAr : profile.situation;

    const cardsWrap = document.getElementById("optionCards");
    cardsWrap.innerHTML = "";
    profile.options.forEach(opt => {
      const title = currentLang === "ar" ? HABIT_TITLES_AR[opt.letter] : opt.title;
      const text = currentLang === "ar" ? opt.textAr : opt.text;
      const card = document.createElement("div");
      card.className = "option-card" + (state.selectedLetter === opt.letter ? " selected" : "");
      card.dataset.letter = opt.letter;
      card.innerHTML = `
        <div class="opt-title"><span class="opt-letter">${opt.letter}</span>${title}</div>
        <div class="opt-text">${text}</div>
      `;
      card.addEventListener("click", () => selectOption(opt.letter));
      cardsWrap.appendChild(card);
    });

    updateFinishButton();
  }

  function startGroup(idx) {
    state.profileIndex = idx;
    state.selectedLetter = null;
    state.justification = "";
    state.elapsedSeconds = 0;

    justificationInput.value = "";
    renderProfileScreen();
    startTimer();
    showScreen("work");
  }

  function selectOption(letter) {
    state.selectedLetter = letter;
    document.querySelectorAll(".option-card").forEach(c => {
      c.classList.toggle("selected", c.dataset.letter === letter);
    });
    updateFinishButton();
  }

  justificationInput.addEventListener("input", () => {
    state.justification = justificationInput.value;
    updateFinishButton();
  });

  function updateFinishButton() {
    const btn = document.getElementById("finishBtn");
    const hasChoice = !!state.selectedLetter;
    const hasText = justificationInput.value.trim().length > 0;
    btn.disabled = !(hasChoice && hasText);
  }

  // ---- timer ----
  function startTimer() {
    stopTimer();
    state.timerRunning = true;
    document.getElementById("timerPill").classList.remove("stopped");
    state.timerId = setInterval(() => {
      state.elapsedSeconds += 1;
      renderTimer();
    }, 1000);
    renderTimer();
  }
  function stopTimer() {
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = null;
    state.timerRunning = false;
  }
  function renderTimer() {
    const m = Math.floor(state.elapsedSeconds / 60).toString().padStart(2, "0");
    const s = (state.elapsedSeconds % 60).toString().padStart(2, "0");
    document.getElementById("timerText").textContent = `${m}:${s}`;
  }

  // ---- review screen ----
  function renderReviewScreen() {
    if (state.profileIndex === null) return;
    const profile = PROFILES[state.profileIndex];
    const t = TEXT[currentLang];
    const opt = profile.options.find(o => o.letter === state.selectedLetter);

    document.getElementById("reviewBadge").textContent = t.groupLabel(state.profileIndex + 1);
    document.getElementById("reviewSituation").textContent = currentLang === "ar" ? profile.situationAr : profile.situation;

    if (opt) {
      const title = currentLang === "ar" ? HABIT_TITLES_AR[opt.letter] : opt.title;
      const text = currentLang === "ar" ? opt.textAr : opt.text;
      document.getElementById("reviewChoice").innerHTML =
        `<div class="opt-title">${opt.letter}. ${title}</div><div class="opt-text">${text}</div>`;
    }

    // participant-written text — never translated, shown exactly as typed
    document.getElementById("reviewJustification").textContent = state.justification;

    const timeStr = document.getElementById("timerText").textContent;
    document.getElementById("reviewTime").innerHTML =
      `${t.timeUsedLabel}: <bdi dir="ltr" style="unicode-bidi:isolate;">${timeStr}</bdi>`;
  }

  // ---- finish / review ----
  document.getElementById("finishBtn").addEventListener("click", () => {
    state.justification = justificationInput.value.trim();
    stopTimer();
    document.getElementById("timerPill").classList.add("stopped");
    renderReviewScreen();
    showScreen("review");
  });

  document.getElementById("editBtn").addEventListener("click", () => {
    renderProfileScreen();
    showScreen("work");
    startTimer();
  });

  // ---- language toggle ----
  function setLang(lang) {
    if (lang !== "en" && lang !== "ar") return;
    if (lang === currentLang) return;
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll(".lang-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });

    renderStaticText();
    if (screens.work.classList.contains("active")) renderProfileScreen();
    if (screens.review.classList.contains("active")) renderReviewScreen();
  }
  document.querySelectorAll(".lang-btn").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });

  // ---- initial render ----
  renderStaticText();
</script>

</body>
</html>
